name: Build and Publish
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0          # required: full history for the commit count
    # Version is stated in package.json (Major.Minor + optional -suffix); the patch is the
    # number of commits since the version line last changed. See docs/release-branching-strategy.md.
    - name: Get version
      id: version
      uses: AndrewMcLachlan/Actions/get-node-version@v4
    - run: echo "::notice::Version ${{ steps.version.outputs.version }}"
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: 'package-lock.json'
        registry-url: "https://npm.pkg.github.com"
    - run: npm ci --no-scripts
    - run: npm pkg set version=${{ steps.version.outputs.version }} --workspace=moo-ds --workspace=moo-app --workspace=moo-icons
    # Before the tests, for the same reason type-check runs after the build below:
    # moo-ds imports @andrewmclachlan/moo-icons, which resolves through that
    # package's `exports` to dist/index.es.js. dist is gitignored, so on a fresh
    # checkout it does not exist and every moo-ds test file that reaches Tooltip
    # fails with "Failed to resolve import". It passes locally only when a stale
    # dist happens to be lying around.
    - run: npm run build --workspace=moo-icons
    - run: npm run test:run
    - run: npm run build --workspace=moo-ds --workspace=moo-app
    # Nothing else here type-checks the tests: vitest runs through esbuild, which
    # strips types without checking them, and the build above compiles src only.
    # Without this step a test file can stop compiling and every check stays green.
    #
    # After the build, not before: moo-app and demoo resolve @andrewmclachlan/moo-ds
    # to the built package's declarations, so type-checking them on a fresh
    # checkout fails with "Cannot find module" until moo-ds has been built.
    - run: npm run type-check
    # Publish only from main (the stable trunk) or a prerelease line (a branch whose stated
    # version carries a suffix). Suffix-less non-main branches (incl. PRs) publish nothing.
    - name: Publish
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || steps.version.outputs.is-prerelease == 'true')
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm publish --workspace=moo-ds --workspace=moo-app --workspace=moo-icons
